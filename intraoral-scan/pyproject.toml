[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intraoral-scan"
version = "0.1.0"
description = "Research prototype: intraoral 3D scan from smartphone video, with SSM completion of unseen surfaces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
capture = ["opencv-contrib-python>=4.7", "trimesh>=4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
intraoral-scan = "intraoral_scan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intraoral_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
